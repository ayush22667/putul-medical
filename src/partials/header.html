<header class="site-header" id="top">
  <div class="nav">
    <a href="#top" class="brand" aria-label="{{name}} home">
      <svg class="ic" aria-hidden="true"><use href="#i-shield" /></svg><span>{{name}}</span>
    </a>

    <nav class="nav-links" aria-label="Main">
      <a href="#order" data-i18n="nav_order">Order Medicine</a>
      <a href="#consultation" data-i18n="nav_doctors">Doctors</a>
      <a href="#diagnostics" data-i18n="nav_diagnostics">Diagnostics</a>
      <a href="#services" data-i18n="nav_services">Services</a>
      <a href="#about" data-i18n="nav_about">About</a>
      <button type="button" data-open="story" data-i18n="nav_story">Our Story</button>
      <a href="#contact" data-i18n="nav_contact">Contact</a>
    </nav>

    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language">
      <span class="lang-thumb" aria-hidden="true"></span>
      <button type="button" class="lang-btn active" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
    </div>
    <!-- feature:signin -->
    <button type="button" class="icon-btn" data-open="signin" aria-label="Sign in">
      <svg class="ic" aria-hidden="true"><use href="#i-user" /></svg>
    </button>
    <!-- /feature:signin -->
    <a href="#upload" class="btn btn-amber nav-cta" data-i18n="nav_cta">Order Now</a>
    <button type="button" class="icon-btn menu-btn" data-open="menu" aria-label="Menu">
      <svg class="ic" aria-hidden="true"><use href="#i-menu" /></svg>
    </button>
  </div>
</header>
